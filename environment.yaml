name: transunet
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.8
  - pip
  - cudatoolkit=11.8
  - nibabel
  - scikit-image
  - tqdm
  - pillow
  - psutil
  - humanize
  - scipy
  - einops
  - matplotlib
  - SimpleITK
  - timm
  - torchmetrics
  - pip:
    - --extra-index-url https://download.pytorch.org/whl/nightly/cu118
    - torch
    - torchvision
    - torchaudio
    - torchviz
    - opencv-python-headless
    - tensorboard