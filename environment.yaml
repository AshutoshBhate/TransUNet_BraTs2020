name: transunet
channels:
  - conda-forge # MedPy is often available here
  - defaults
dependencies:
  # Core Python & CUDA
  - python=3.8
  - pip
  - cudatoolkit=11.8

  # Numerical & Scientific
  - numpy # Already a dependency for many others, but good to list
  - scipy

  # Image Processing & Medical Imaging
  - nibabel
  - scikit-image
  - pillow # PIL
  - SimpleITK
  - medpy # <-- Added MedPy

  # ML/DL Core & Ecosystem (installed via pip below for specific versions/builds)

  # Utilities
  - tqdm
  - psutil
  - humanize
  - matplotlib
  - einops
  - timm # Can be installed via conda, but pip section below might override

  # Pip dependencies (for specific versions or CUDA builds)
  - pip:
    - --extra-index-url https://download.pytorch.org/whl/cu118 # Using PyTorch index for CUDA build
    - torch # Version will be determined by index and compatibility
    - torchvision
    - torchaudio
    - torchviz
    - torchmetrics
    - opencv-python-headless
    - tensorboard # Often useful for logging
    # Note: timm, einops etc. could also be listed here if specific pip versions are needed.
